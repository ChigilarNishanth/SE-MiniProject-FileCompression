name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Compile C++ File Compression Utility
      run: |
        mkdir -p build
        g++ -std=c++17 -O2 -Wall -Wextra -Iinclude src/cli_parser.cpp src/archive_io.cpp src/huffman_tree.cpp src/bit_stream.cpp src/compression_engine.cpp src/main.cpp -o build/czip

    - name: Verify Executable Execution
      run: |
        ./build/czip --help

    - name: Validate Mudit bit packing and SHA-256 compression fixtures
      run: |
        g++ -std=c++17 -Wall -Wextra -Werror -Iinclude src/bit_stream.cpp tests/bit_stream_tests.cpp -o /tmp/bit_tests
        /tmp/bit_tests /tmp/packed_test.bin
        g++ -std=c++17 -Wall -Wextra -Werror -Iinclude src/archive_io.cpp src/huffman_tree.cpp tests/reference_restore.cpp -o /tmp/reference_restore
        python3 tests/test_lossless.py build/czip /tmp/reference_restore
