name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Iinclude \
            src/main.cpp src/cli_parser.cpp src/archive_io.cpp \
            -o czip

      - name: Smoke test CLI
        run: |
          ./czip --help >/tmp/help.txt 2>&1
          grep -q "Usage:" /tmp/help.txt

      - name: Smoke test header write/read flow
        run: |
          printf "ABABA" > sample.txt
          ./czip -c sample.txt sample.czip
          ./czip -d sample.czip restored.txt

      - name: Smoke test invalid archive detection
        run: |
          printf "NO" > fake.czip
          if ./czip -d fake.czip out.txt; then
            echo "Expected invalid archive detection to fail"
            exit 1
          fi
