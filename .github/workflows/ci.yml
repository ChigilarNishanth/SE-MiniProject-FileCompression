name: C/C++ CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up GCC
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Create Build Directory
      run: mkdir -p build

    - name: Compile Application & Test Suite
      run: |
        g++ -std=c++17 -Wall -Wextra -Iinclude src/*.cpp -o build/czip
        g++ -std=c++17 -Wall -Wextra -Iinclude src/cli_parser.cpp src/archive_io.cpp src/freq_analyzer.cpp src/huffman_tree.cpp src/bit_stream.cpp src/compression_engine.cpp src/decompression_engine.cpp src/verifier.cpp tests/verify_lossless.cpp -o build/czip_tests

    - name: Run Isolated Unit Tests
      run: python3 tests/run_unit_tests.py

    - name: Verify SHA-256 Using Production CLI
      run: python3 tests/test_lossless.py build/czip --production-decoder

    - name: Run Integration Tests
      run: |
        chmod +x build/czip build/czip_tests
        ./build/czip_tests

    - name: Run Code & Branch Coverage Analysis Toolchain
      run: python3 tests/run_coverage.py